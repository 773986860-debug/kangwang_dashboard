<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>康王经营工作台 · 访问验证</title>
<style>
:root{--bg:#f3f5f1;--card:#ffffff;--line:#e1e9e4;--muted:#7a8a82;--primary:#2f7d5c;--err:#c0564f}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#22322b}
.gate{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 34px;box-shadow:0 8px 30px rgba(47,125,92,.08);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.brand h1{font-size:19px;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.hint{color:var(--muted);font-size:13px;margin:14px 0 26px}
input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none;text-align:center;letter-spacing:2px;transition:border .2s}
input:focus{border-color:var(--primary)}
input.err{border-color:var(--err);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
button{width:100%;margin-top:16px;padding:13px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:filter .2s}
button:hover{filter:brightness(1.08)}
.msg{color:var(--err);font-size:13px;margin-top:12px;min-height:18px}
.note{margin-top:26px;color:var(--muted);font-size:11px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<div class="gate">
  <div class="brand">
    <span class="brand-mark">K</span>
    <div><h1>康王经营工作台</h1><small>内部数据 · 请输入访问密码</small></div>
  </div>
  <p class="hint">本页面包含店铺经营数据，仅供授权人员查看。</p>
  <input id="pw" type="password" placeholder="请输入访问密码" autofocus autocomplete="off">
  <button id="go">进 入 工 作 台</button>
  <div class="msg" id="msg"></div>
  <div class="note">密码错误请向管理员索取。<br>康王 · SKU经营工作台</div>
</div>
<script>
(function(){
  var PW=atob('a2FuZ3dhbmc4ODg4ODg=');
  // 已验证过则直接进入
  try{
    if(sessionStorage.getItem('kw-auth')==='1'){location.replace('dashboard.html');return;}
  }catch(e){}
  var pw=document.getElementById('pw'),btn=document.getElementById('go'),msg=document.getElementById('msg');
  function tryEnter(){
    var v=pw.value;
    if(!v){msg.textContent='请输入密码';pw.classList.add('err');return;}
    if(v===PW){
      try{sessionStorage.setItem('kw-auth','1');}catch(e){}
      location.replace('dashboard.html');
    }else{
      msg.textContent='密码不正确，请重新输入';
      pw.classList.add('err');
      pw.select();
      setTimeout(function(){pw.classList.remove('err');},400);
    }
  }
  btn.addEventListener('click',tryEnter);
  pw.addEventListener('keydown',function(ev){if(ev.key==='Enter')tryEnter();});
})();
</script>
</body>
</html>
