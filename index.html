<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f5f1"><title>康王 · SKU经营工作台</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="styles-v2.css"><link rel="stylesheet" href="styles-v3.css"></head><body>
<aside class="sidebar"><div class="brand"><span class="brand-mark">K</span><div><strong>康王</strong><small>SKU经营工作台</small></div></div><nav><button class="nav-item active" data-section="overview"><span>⌁</span>经营总览</button><button class="nav-item" data-section="sales"><span>↗</span>销售下钻</button><button class="nav-item" data-section="ads"><span>◎</span>投放效率</button><button class="nav-item" data-section="inventory"><span>▦</span>货品监控</button></nav><a class="connected-update" href="/admin" target="_top" aria-label="联网更新数据"><span aria-hidden="true">↻</span><span>更新数据</span></a><div class="source-note"><span class="status-dot"></span><div><strong>离线快照</strong><small>日级数据截至 2026.09.23</small></div></div></aside>
<main><header class="topbar"><div><p class="eyebrow">京东渠道 · 日级 SKU 数据</p><h1>经营总览</h1></div><div class="header-actions"><label class="search"><span>⌕</span><input id="globalSearch" placeholder="搜索 SKU / 货品"></label><button id="exportBtn" class="button secondary">导出当前视图</button><button id="filterBtn" class="button primary">筛选 <span id="filterCount">0</span></button></div></header>
<section class="date-command" data-view="overview sales ads" aria-label="日期范围"><div class="quick-dates" id="quickDates"><button data-range="yesterday">昨天</button><button data-range="3d">近3天</button><button data-range="7d" class="active">近7天</button><button data-range="week">自然周</button><button data-range="custom">自定义</button></div><div class="date-readout"><span id="dateText"></span><small id="coverageText"></small></div><div class="custom-dates" id="customDates" hidden><label>开始<input type="date" id="startDate"></label><span>—</span><label>结束<input type="date" id="endDate"></label><button id="applyDate" class="button primary">应用</button></div></section>
<section class="drillbar" data-view="overview sales ads"><div class="drill-nav"><button id="backLevel" class="back-level" hidden>← 返回上一级</button><div id="breadcrumb"><button data-level="all">全部类目</button></div></div><span>点击类目或 SKU 可继续下钻</span></section><section class="active-filters" id="activeFilters"></section>
<section class="insight-banner" data-view="overview sales ads"><div><span class="label">当前时段判断</span><h2 id="insightTitle">正在计算所选日期范围</h2><p id="insightText"></p></div><div class="snapshot"><span>数据截至</span><strong>09.22</strong><small>70,664 条日级记录</small></div></section><section class="kpi-grid" id="kpiGrid" data-view="overview sales ads"></section>
<section class="grid two-one" data-view="overview sales"><article class="panel chart-panel"><div class="panel-head"><div><span class="section-kicker">销售趋势</span><h3 id="trendTitle">日 GMV</h3></div><div class="legend"><span><i class="swatch primary"></i>GMV</span><span><i class="swatch muted"></i>投放花费</span></div></div><div id="salesChart" class="chart"></div></article><article class="panel"><div class="panel-head"><div><span class="section-kicker">类目结构</span><h3>GMV 贡献</h3></div><span class="hint">点击下钻</span></div><div id="lineRanking" class="drill-ranking"></div></article></section>
<section class="grid equal" data-view="overview sales ads"><article class="panel"><div class="panel-head"><div><span class="section-kicker">SKU排行</span><h3>单品经营表现</h3></div><div class="segmented" id="skuMetric"><button class="active" data-metric="gmv">GMV</button><button data-metric="spend">花费</button><button data-metric="roi">ROI</button></div></div><div id="skuRanking" class="sku-ranking"></div></article><article class="panel"><div class="panel-head"><div><span class="section-kicker">效率诊断</span><h3>SKU 投放矩阵</h3></div><span class="hint">横轴花费 · 纵轴ROI</span></div><div id="skuMatrix" class="chart compact"></div></article></section>
<section class="panel sku-detail" id="skuDetail" hidden data-view="overview sales ads"><div class="panel-head"><div><span class="section-kicker">SKU 下钻</span><h3 id="skuDetailTitle"></h3></div><button id="closeSku" class="back-detail">← 返回所属类目</button></div><div class="detail-kpis" id="detailKpis"></div><div class="grid equal detail-grid"><div><h4>逐日表现</h4><div id="skuDaily" class="chart compact"></div></div><div><h4>经营诊断</h4><div id="skuDiagnosis" class="diagnosis"></div></div></div></section>
<section class="kpi-grid inventory-summary" id="inventorySummary" data-view="inventory"></section><section class="panel" data-view="inventory"><div class="panel-head"><div><span class="section-kicker">库存监控</span><h3>SKU 供给状态</h3></div><div class="segmented" id="riskFilter"><button class="active" data-risk="all">全部</button><button data-risk="urgent">急需补货</button><button data-risk="slow">高周转</button></div></div><div class="table-wrap"><table><thead><tr><th>货品</th><th>店铺</th><th>现货</th><th>在途</th><th>30日出库</th><th>周转天数</th><th>建议补货</th><th>状态</th></tr></thead><tbody id="inventoryBody"></tbody></table></div><div class="mobile-cards" id="inventoryCards"></div></section></main>
<div class="drawer-backdrop" id="drawerBackdrop"></div><aside class="drawer filter-drawer" id="filterDrawer" aria-hidden="true"><div class="drawer-head"><div><span class="section-kicker">全局条件</span><h2>筛选</h2></div><button id="closeDrawer" class="icon-button">×</button></div><label>店铺<select id="shopFilter"><option value="all">全部店铺</option><option>旗舰店</option><option>大药房</option></select></label><label>类目<select id="lineFilter"><option value="all">全部类目</option></select></label><label>SKU<span class="select-search"><input id="skuSearch" placeholder="输入名称或 SKU 编码"><select id="skuFilter" size="7"><option value="all">全部 SKU</option></select></span></label><div class="drawer-actions"><button id="resetFilters" class="button secondary">重置</button><button id="applyFilters" class="button primary">应用筛选</button></div></aside><div id="toast" class="toast"></div>
